[package]
name = "scriptmetakit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Rust library for parsing and scanning SCRIPTMETA metadata."
publish = false

[workspace]
members = [".", "scriptmetakit_ffi"]
resolver = "3"

[lib]
name = "scriptmetakit"
path = "src/lib.rs"

[dependencies]
notify = { version = "8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"] }

[features]
default = []
blocking-http = ["dep:reqwest"]
native-watch = ["dep:notify"]

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "abort"
